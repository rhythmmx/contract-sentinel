[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "contract-sentinel"
version = "0.1.0"
description = "Streaming data contract checks with privacy-preserving SQLite history and a desktop inspector"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
contract-sentinel = "contract_sentinel.cli:main"
contract-sentinel-gui = "contract_sentinel.gui:main"
[tool.setuptools.packages.find]
where = ["src"]
