name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff==0.14.0 mypy==1.18.2
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src --ignore-missing-imports --check-untyped-defs
      - run: python -m unittest discover -s tests -v
      - run: contract-sentinel check examples/events.contract.json examples/good.ndjson
      - run: contract-sentinel diff examples/events.contract.json examples/events.contract.json
