name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff==0.14.0 mypy==1.18.2
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src --ignore-missing-imports --check-untyped-defs
      - run: python -m unittest discover -s tests -v
      - run: contract-sentinel check examples/events.contract.json examples/good.ndjson
      - run: contract-sentinel diff examples/events.contract.json examples/events.contract.json
      - run: contract-sentinel check examples/nested.contract.json examples/nested-good.ndjson
      - run: contract-sentinel diff examples/nested.contract.json examples/nested.contract.json
